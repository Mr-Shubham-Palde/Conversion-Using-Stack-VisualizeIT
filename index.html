<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Expression Conversion Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tsparticles"></div>

<div class="app">

<h1>Expression Conversion Visualizer</h1>

<div class="controls">

  <select id="mode">
    <option value="postfix">Infix → Postfix</option>
    <option value="prefix">Infix → Prefix</option>
  </select>

  <input type="text" id="expressionInput" placeholder="Enter Infix Expression">

  <label>Speed:</label>
  <input type="range" id="speedControl" min="0.2" max="2" step="0.1" value="1">
  <span id="speedLabel">1x</span>

  <button onclick="startConversion()">Start</button>
  <button onclick="resetAll()">Reset</button>

</div>

<div class="info">
  <div><b>Step:</b> <span id="stepText">Waiting...</span></div>
</div>

<div class="visual-section">

  <div>
    <h3>Stack (Top ↑)</h3>
    <div id="stackContainer" class="stack-container"></div>
  </div>

  <div>
    <h3>Output</h3>
    <div id="outputContainer" class="output-box"></div>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script src="script.js"></script>

<script>
tsParticles.load("tsparticles", {
  background: { color: "#0d0d0d" },
  particles: {
    number: { value: 80 },
    color: { value: "#00ff88" },
    links: { enable: true, color: "#00ff88" },
    move: { enable: true, speed: 2 }
  }
});
</script>

</body>
</html>
